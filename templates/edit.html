<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Idea</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor">
        <h2>Editar Idea</h2>

        {% if error %}
            <p class="error" id="mensaje-error">{{ error }}</p>
        {% endif %}

        <form method="POST" class="form-idea">
            <input type="text" name="titulo" id="titulo" value="{{ idea['titulo'] }}">
            <input type="text" name="descripcion" id="descripcion" value="{{ idea['descripcion'] }}">
            <input type="text" name="categoria" id="categoria" value="{{ idea['categoria'] }}">
            <button type="submit" id="btn-guardar">Guardar</button>
        </form>

        <a href="{{ url_for('dashboard') }}">Volver</a>
    </div>
</body>
</html>
